syntax = "proto3";
package evmos.v9.callback;

option go_package = "github.com/evmos/evmos/v9/x/callback/types";

message BlockInfo {
	uint64 Height   = 1;
	uint64 Time     = 2;
	string ChainId  = 3;
}
  
message EncryptAddMessage {
	string contract_address      = 1;
	string function_name = 2;
	string argument = 4;
}

message EncryptAddIResponse {
	uint32 value     = 1;
}